services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_dev_password
      POSTGRES_DB: school_os
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - school_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_os"]
      interval: 5s
      retries: 10
volumes:
  school_data:
